<!DOCTYPE html>
<html>
<head>
    <title>GitHub Connector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚀 GitHub Connector</h1>

<button onclick="login()">Login with GitHub</button>

<hr>

<input type="text" id="token" placeholder="Paste Access Token">

<hr>

<h3>Repositories</h3>
<button onclick="getRepos()">Fetch Repos</button>

<h3>Issues</h3>
<input type="text" id="owner" placeholder="Owner">
<input type="text" id="repo" placeholder="Repo">
<button onclick="getIssues()">Get Issues</button>

<h3>Create Issue</h3>
<input type="text" id="title" placeholder="Title">
<input type="text" id="body" placeholder="Body">
<button onclick="createIssue()">Create Issue</button>

<h3>Create Pull Request</h3>
<input type="text" id="pr_title" placeholder="PR Title">
<input type="text" id="head" placeholder="Head Branch">
<input type="text" id="base" placeholder="Base Branch">
<button onclick="createPR()">Create PR</button>

<hr>

<h2>Output</h2>
<pre id="output"></pre>

<script src="app.js"></script>

</body>
</html>
